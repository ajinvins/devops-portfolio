
name: DevOps Practice CI

on:
  push:
    branches: [main]

jobs:
  test-website:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Verify website exists
        run: test -f index.html

      - name: Show success
        run: echo "My second CI pipeline works!"
